<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel</title>
    <link rel="stylesheet" href="src/colorthemes.css">
    <link rel="stylesheet" href="src/button.css">
    <link rel="stylesheet" href="src/nav.css">
    <link rel="stylesheet" href="src/main.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body style="background-image: url('assets/img/index-bg.jpg'); background-size: cover; background-position: center;">
    <div class="container min-vh-100 d-flex flex-column">
        <header class="row mini d-flex align-items-center justify-content-center theme-darkblue">
            <div class="col-12 mini d-flex justify-content-center gap-3" style="color: white;">
                <span>
                    <a href="index.html" class="button button-link">inicio</a>
                </span>
                <span>
                    <a href="documentos.html" class="button button-link">documentos</a>
                </span>
                <span>
                    <a href="encuestas.html" class="button button-link">encuestas</a>
                </span>
                <span>
                    <a href="preguntas.html" class="button button-link">ayuda</a>
                </span>
            </div>
        </header>
        <main class="row centered-vertical rounded p-3" style="margin-top: 20px; margin-bottom: 20px; background-color: rgba(0, 0, 0, 0.7);">
            <div class="col-md-4 col-sm-12"> <!--Menu-->
                <section class="frame-relevant d-flex flex-column gap-2">
                    <h4>Documentos</h4>
                    <button class="button button-default button-theme-whiteblue">Crear</button>
                    <button class="button button-default button-theme-whiteyellow">Actualizar</button>
                    <button class="button button-default button-theme-whitered">Eliminar</button>
                </section>
            </div>
            <div class="col-lg-8 col-md-6 col-sm-12 d-flex flex-column align-items-center gap-3"> <!--Panel-->
                <div class="col frame-relevant w-100"> <!--Documentos-->
                    <nav class="col d-flex">
                        <div class="col d-flex align-items-center justify-content-end"> <!--Parte derecha del header-->
                            <button class="button button-theme-whiteblue dropdown-toggle" data-bs-toggle="dropdown" style="height: auto;" >HOLA</button>
                            <ul class="dropdown-menu">
                                <li><button class="dropdown-item" href="#">FECHA</button></li>
                                <li><button class="dropdown-item" href="#">A-Z</button></li>
                            </ul>
                            <input class="nav-input" type="text" placeholder="Ingrese nombre de documento">
                        </div>
                    </nav>
                    <div class="accordion p-3" id="accordionExample">
                        <div class="accordion-item">
                            <h2 class="accordion-header">
                            <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="false" aria-controls="collapseOne">
                                <b>SERVICIO 1</b>
                            </button>
                            </h2>
                            <div id="collapseOne" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                            <div class="accordion-body">
                                <ul class="list-group list-group-flush">
                                    <li class="list-group-item"><a href="#" class="button button-source">Documento n1</a></li>
                                    <li class="list-group-item"><a href="#" class="button button-source">Documento n1</a></li>
                                </ul>
                            </div>
                            </div>
                        </div>
                        <div class="accordion-item">
                            <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseTwo" aria-expanded="false" aria-controls="collapseTwo">
                                <b>SERVICIO 2</b>
                            </button>
                            </h2>
                            <div id="collapseTwo" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                            <div class="accordion-body">
                                <ul class="list-group list-group-flush">
                                    <li class="list-group-item"><a href="#" class="button button-source">Documento n1</a></li>
                                    <li class="list-group-item"><a href="#" class="button button-source">Documento n1</a></li>
                                </ul>
                            </div>
                            </div>
                        </div>
                        <div class="accordion-item">
                            <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseThree" aria-expanded="false" aria-controls="collapseThree">
                                <b>SERVICIO 3</b>
                            </button>
                            </h2>
                            <div id="collapseThree" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                            <div class="accordion-body">
                                <ul class="list-group list-group-flush">
                                    <li class="list-group-item"><a href="#" class="button button-source">Documento n1</a></li>
                                    <li class="list-group-item"><a href="#" class="button button-source">Documento n1</a></li>
                                </ul>
                            </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <footer class="row theme-darkblue justify-content-center mini mt-auto">
            <!-- Añadido align-items-center y corregido el ancho de columnas si usas d-flex -->
            <div class="col-12 d-flex justify-content-center gap-4 align-items-center">
                <!-- Eliminados los col-12/col-md-3 para que Flexbox maneje el espacio de forma fluida -->
                <section>
                    <p class="mb-0">E.D.S.U.</p> <!-- mb-0 quita el margen del párrafo -->
                </section>
                <section>
                    <p class="mb-0">Hospital de Clínicas</p> <!-- mb-0 quita el margen del párrafo -->
                </section>
            </div>
            <div class="col-12 d-flex justify-content-center">
                <p class="mb-0" style="color: rgb(212, 188, 255)">© 2026 Todos los derechos reservados</p> <!-- mb-0 quita el margen del párrafo -->
            </div>
        </footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
