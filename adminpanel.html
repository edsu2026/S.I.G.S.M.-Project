<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel</title>
    <link rel="stylesheet" href="src/frame.css">
    <link rel="stylesheet" href="src/images.css">
    <link rel="stylesheet" href="src/button.css">
    <link rel="stylesheet" href="src/nav.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <header class="row frame">
            <div class="col-6 d-flex gap-2"> <!--Datos del usuario-->
                <span>
                    <a href="#">
                        <img src="assets/imgs/profile_icon.png" class="profile-icon">
                    </a>
                </span>
                <span>
                    <p style="margin: 0;">USERNAME</p>
                    <p style="margin: 0;">5776****</p>
                </span>
            </div>
            <div class="col-6 d-flex justify-content-end align-items-center"> <!--Opciones del usuario-->
                <a href="index.html" class="button button-default button-option">Volver al Portal</a>
            </div>
        </header>
        <main class="row frame">
            <div class="col-md-4 col-sm-12"> <!--Menu-->
                <section class="frame-relevant d-flex flex-column gap-2">
                    <h4>Usuarios</h4>
                    <button class="button button-default button-theme-whiteblue">Buscar</button>
                    <hr>
                    <h4>Documentos</h4>
                    <button class="button button-default button-theme-whiteblue">Crear</button>
                    <button class="button button-default button-theme-whiteyellow">Actualizar</button>
                    <button class="button button-default button-theme-whitered">Eliminar</button>
                </section>
            </div>
            <div class="col-lg-8 col-md-6 col-sm-12 d-flex flex-column align-items-center gap-3"> <!--Panel-->
                <div class="col-9 d-flex frame-relevant align-items-center">
                    <section class="col-lg-6 col-sm-12 d-flex gap-2 align-items-center">
                        <span>
                            <img class="preview-icon" src="assets/imgs/profile_icon.png">
                        </span>
                        <span>
                            <h4>Ian Franco</h4>
                            <hr>
                            <p style="margin: 0;">5776****</p>
                            <p class="text-break" style="margin: 0;">097128679</p>
                        </span>
                    </section>
                    <section class="col-lg-6 col-sm-12 w-50 d-flex flex-column h-100">
                        <button class="button button-default button-theme-whitered">Volver</button>
                    </section>
                </div> 

                
                <div class="col frame-relevant w-100"> <!--Documentos-->
                    <nav class="col d-flex">
                        <div class="col d-flex align-items-center justify-content-end"> <!--Parte derecha del header-->
                            <button class="button button-theme-whiteblue dropdown-toggle" data-bs-toggle="dropdown" style="height: auto;" >HOLA</button>
                            <ul class="dropdown-menu">
                                <li><button class="dropdown-item" href="#">FECHA</button></li>
                                <li><button class="dropdown-item" href="#">A-Z</button></li>
                            </ul>
                            <input class="nav-input" type="text" placeholder="Ingrese nombre de documento">
                        </div>
                    </nav>
                    <div class="accordion p-3" id="accordionExample">
                        <div class="accordion-item">
                            <h2 class="accordion-header">
                            <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="false" aria-controls="collapseOne">
                                <b>SERVICIO 1</b>
                            </button>
                            </h2>
                            <div id="collapseOne" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                            <div class="accordion-body">
                                <ul class="list-group list-group-flush">
                                    <li class="list-group-item"><a href="#" class="button button-source">Documento n1</a></li>
                                    <li class="list-group-item"><a href="#" class="button button-source">Documento n1</a></li>
                                </ul>
                            </div>
                            </div>
                        </div>
                        <div class="accordion-item">
                            <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseTwo" aria-expanded="false" aria-controls="collapseTwo">
                                <b>SERVICIO 2</b>
                            </button>
                            </h2>
                            <div id="collapseTwo" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                            <div class="accordion-body">
                                <ul class="list-group list-group-flush">
                                    <li class="list-group-item"><a href="#" class="button button-source">Documento n1</a></li>
                                    <li class="list-group-item"><a href="#" class="button button-source">Documento n1</a></li>
                                </ul>
                            </div>
                            </div>
                        </div>
                        <div class="accordion-item">
                            <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseThree" aria-expanded="false" aria-controls="collapseThree">
                                <b>SERVICIO 3</b>
                            </button>
                            </h2>
                            <div id="collapseThree" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                            <div class="accordion-body">
                                <ul class="list-group list-group-flush">
                                    <li class="list-group-item"><a href="#" class="button button-source">Documento n1</a></li>
                                    <li class="list-group-item"><a href="#" class="button button-source">Documento n1</a></li>
                                </ul>
                            </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <footer class="row frame justify-content-center" style="text-align: center;">
            <h3>CONTACTOS</h3>
            <div class="col-8 d-flex justify-content-between">
                <section class="col-3">
                <h4>Desarrolladores</h4>
                    <hr>
                    <div class="footer-section-body">
                        <span>
                            <p>DEV 1</p>
                        </span>
                    </div>
                </section>
                <section class="col-3">
                    <h4>Trabajadores</h4>
                    <hr>
                    <div class="footer-section-body">
                        <span>
                            <p>Trabajador 1</p>
                        </span>
                    </div>
                </section>
            </div>
        </footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
