<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel</title>
    <link rel="stylesheet" href="src/colorthemes.css">
    <link rel="stylesheet" href="src/button.css">
    <link rel="stylesheet" href="src/nav.css">
    <link rel="stylesheet" href="src/main.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body style="background-image: url('assets/img/index-bg.jpg'); background-size: cover; background-position: center;">
    <div class="container min-vh-100 d-flex flex-column">
        
        <!-- Header -->
        <header class="row mini d-flex align-items-center justify-content-center theme-darkblue">
            <div class="col-12 mini d-flex justify-content-center gap-3" style="color: white;">
                <span>
                    <a href="index.html" class="button button-link">Inicio</a>
                </span>
            </div>
        </header>

        <!-- Main Content -->
        <main class="row rounded flex-grow-1" style="margin-top: 20px; margin-bottom: 20px; background-color: rgba(0, 0, 0, 0.7);">
            
            <!-- Menu Lateral -->
            <div class="d-flex flex-column col-md-3 col-sm-12 justify-content-between rounded-start" style="background-color: rgba(255, 255, 255, 0.05); padding: 20px;">
                <section class="d-flex flex-column gap-2">
                    <a href="gestion_doc.html" class="button-panel button-theme-blue rounded">
                        Documentos
                    </a>
                    <a href="gestion_cat.html" class="button-panel button-theme-blue rounded">
                        Categorías
                    </a>
                    <a href="gestion_enc.html" class="button-panel button-theme-blue rounded">
                        Encuestas
                    </a>
                </section>

                <hr>

                <section class="d-flex flex-column gap-2">
                    <a href="gestion_usu.html" class="button-panel button-theme-blue rounded">
                        Usuarios
                    </a>
                </section>

                <hr>

                <section class="d-flex flex-column gap-2">
                    <a href="#" class="button-panel button-theme-red rounded">
                        Log out
                    </a>
                </section>
            </div>

            <!-- Panel Principal -->
            <div class="col-lg-9 col-md-9 col-sm-12 d-flex flex-column p-4 gap-3">
                
                <!-- Buscador / Opciones -->
                <nav class="w-100 d-flex align-items-center justify-content-end">
                    <button class="button-dropdown button-theme-blue dropdown-toggle rounded-start" data-bs-toggle="dropdown" style="height: auto;">
                        OPCIONES
                    </button>
                    <ul class="dropdown-menu">
                        <li><button class="dropdown-item" href="#">FECHA</button></li>
                        <li><button class="dropdown-item" href="#">A-Z</button></li>
                    </ul>
                    <input class="nav-input" type="text" placeholder="Ingrese nombre de documento">
                </nav>

                <!-- Accordion -->
                <div class="accordion w-100" id="accordionExample">
                    
                    <!-- Servicio 1 -->
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="false" aria-controls="collapseOne">
                                <b>SERVICIO 1</b>
                            </button>
                        </h2>
                        <div id="collapseOne" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                            <div class="accordion-body">
                                <ul class="list-group list-group-flush">
                                    <li class="list-group-item"><a href="#" class="button button-source">Documento n1</a></li>
                                    <li class="list-group-item"><a href="#" class="button button-source">Documento n1</a></li>
                                </ul>
                            </div>
                        </div>
                    </div>

                    <!-- Servicio 2 -->
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseTwo" aria-expanded="false" aria-controls="collapseTwo">
                                <b>SERVICIO 2</b>
                            </button>
                        </h2>
                        <div id="collapseTwo" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                            <div class="accordion-body">
                                <ul class="list-group list-group-flush">
                                    <li class="list-group-item"><a href="#" class="button button-source">Documento n1</a></li>
                                    <li class="list-group-item"><a href="#" class="button button-source">Documento n1</a></li>
                                </ul>
                            </div>
                        </div>
                    </div>

                    <!-- Servicio 3 -->
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseThree" aria-expanded="false" aria-controls="collapseThree">
                                <b>SERVICIO 3</b>
                            </button>
                        </h2>
                        <div id="collapseThree" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                            <div class="accordion-body">
                                <ul class="list-group list-group-flush">
                                    <li class="list-group-item"><a href="#" class="button button-source">Documento n1</a></li>
                                    <li class="list-group-item"><a href="#" class="button button-source">Documento n1</a></li>
                                </ul>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="row theme-darkblue justify-content-center mini mt-auto">
            <div class="col-12 d-flex justify-content-center gap-4 align-items-center">
                <section>
                    <p class="mb-0">E.D.S.U.</p>
                </section>
                <section>
                    <p class="mb-0">Hospital de Clínicas</p>
                </section>
            </div>
            <div class="col-12 d-flex justify-content-center">
                <p class="mb-0" style="color: rgb(212, 188, 255)">© 2026 Todos los derechos reservados</p>
            </div>
        </footer>

    </div>

    <script>
        
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
